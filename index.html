<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allan's 隨意畫流程圖</title>
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="toolbar">
  <div class="brand" data-act="about" title="關於">
    <span class="avatars"><img src="img/allan-face.webp" alt="Allan"><img src="img/arale-face.webp" alt="阿拉蕾"></span>
    <span class="name" id="brand">Allan's 隨意畫流程圖</span>
  </div>
  <span class="grp">
    <button data-act="new" title="清空畫布，開始新圖">新增</button>
    <button data-act="open" title="開啟本工具儲存的 SVG，或含有本工具圖片的 Word / PowerPoint 檔">開啟…</button>
    <button data-act="import" title="把現成的流程圖圖檔（PNG / JPG）拆解並重繪成可編輯的圖；也可直接把圖檔拖進畫布或貼上截圖">🖼 圖檔轉換…</button>
    <button data-act="save" title="儲存為可再編輯的 SVG (Ctrl+S)">儲存</button>
  </span>
  <span class="grp">
    <button data-act="undo" title="復原 (Ctrl+Z)">↶ 復原</button>
    <button data-act="redo" title="重做 (Ctrl+Y)">↷ 重做</button>
  </span>
  <span class="grp">
    <span class="lbl">匯出</span>
    <button data-act="pptx" title="匯出為 PowerPoint 原生圖案，可直接在 PowerPoint 內修改">PowerPoint</button>
    <button data-act="docx" title="匯出為 Word 原生圖案（放在繪圖畫布中），可直接在 Word 內改字、改色、搬移">Word</button>
    <button data-act="docximg" title="整張圖以向量圖片放入 Word；日後可用本工具開啟該 .docx 修改後存回">Word（圖片）</button>
    <button data-act="png" title="下載 PNG 圖片">PNG</button>
    <button data-act="copy" title="複製為圖片，可直接貼到 Word / PowerPoint / Email">複製圖片</button>
  </span>
  <span class="grp" id="office-grp" hidden>
    <button data-act="saveback" class="primary" title="把修改後的圖寫回原本的 Office 檔"></button>
  </span>
  <span class="grp right">
    <button data-act="zoomout" title="縮小">－</button>
    <button data-act="zoom100" id="zoom-label" title="回到 100%">100%</button>
    <button data-act="zoomin" title="放大">＋</button>
    <button data-act="fit" title="顯示全部">全覽</button>
    <button data-act="help">說明</button>
    <button data-act="about">關於</button>
  </span>
</header>
<main>
  <aside id="palette"></aside>
  <div id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <g id="viewport"><g id="content"></g><g id="overlay"></g></g>
    </svg>
    <div id="hint">
      <img class="who allan" src="img/allan-full.webp" alt="Allan">
      <div class="bubble"><b>嗨！想畫什麼就畫什麼</b><br>從左側點選或拖曳圖形到畫布開始；<br>手邊有現成的流程圖，按「圖檔轉換」交給阿拉蕾重畫。</div>
      <img class="who arale" src="img/arale-full.webp" alt="阿拉蕾">
    </div>
  </div>
  <aside id="props"></aside>
</main>
<input type="file" id="file-input" accept=".svg,.docx,.pptx" hidden>
<input type="file" id="image-input" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden>
<div id="toast" hidden><img alt=""><span></span></div>
<div id="modal" hidden><div class="box"><div class="body"></div><div class="foot"><button data-close>關閉</button></div></div></div>

<script src="vendor/jszip.min.js"></script>
<script src="js/core.js"></script>
<script src="js/shapes.js"></script>
<script src="js/router.js"></script>
<script src="js/mindmap.js"></script>
<script src="js/render.js"></script>
<script src="js/editor.js"></script>
<script src="js/pptx.js"></script>
<script src="js/io.js"></script>
<script src="js/import.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
